openapi: 3.0.3
info:
  title: Echomong API
  version: 1.0.0

paths:
  /register:
    post:
      operationId: RegisterUser
      summary: 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '409':
          description: 중복된 이메일 또는 사용자명
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /login:
    post:
      operationId: LoginUser
      summary: 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: 로그인 성공 (토큰 발급)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /echomong/{id}:
    get:
      operationId: GetEchomong
      summary: Echomong 1개 조회
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Echomong"
        '404':
          description: 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    Echomong:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        lyrics:
          type: string
        img_url:
          type: string
          format: uri

    RegisterRequest:
      type: object
      required:
        - email
        - username
        - password
      properties:
        email:
          type: string
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 6

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string

    User:
      type: object
      properties:
        email:
          type: string
        username:
          type: string

    # 로그인 응답 (토큰)
    LoginResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    # 에러 응답 공통 스키마
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: 에러 메시지
        code:
          type: integer
          description: 에러 코드 (optional)

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
