version: "2"
sql:
- engine: "postgresql"
  schema: "db/schema/schema.sql"
  queries:
  - "db/query/echomong.sql"
  - 'db/query/user.sql'
  gen:
    go:
      # ★ 코드가 생성될 위치
      out: "internal/repository/db"
      package: "db"
      emit_json_tags: true
      sql_package: "pgx/v5"
      emit_interface: true
