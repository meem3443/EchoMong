services:
  app:
    build:
      context: ../frontend # <-- 1. 빌드 컨텍스트(소스코드) 위치를 한 단계 위 'frontend' 폴더로 지정
      dockerfile: ../backend/Dockerfile # <-- 2. Dockerfile은 현재 폴더(backend/)에 있는 것을 사용
      args:
        VITE_KAKAO_MAP_JS_KEY: ${VITE_KAKAO_MAP_JS_KEY}
        VITE_KAKAO_MAP_REST_KEY: ${VITE_KAKAO_MAP_REST_KEY}
    container_name: ecomong_app
    ports:
      - "8080:80" # [PC 포트]:[컨테이너 내부 포트] (앱 포트에 맞게 수정)
    depends_on:
      - db # 'db' 서비스가 먼저 실행된 후에 'app'이 실행됨
    environment:
      # ★★★ 앱에서 사용할 환경 변수 (DB 접속 정보) ★★★
      # 호스트 이름이 'localhost'가 아닌 'db' (서비스 이름)인 것을 확인하세요!
      - DATABASE_URL=postgresql://myuser:mypassword@db:5432/ecomongdb?sslmode=disable
      # (사용하는 DB 종류와 인증 정보에 맞게 수정)

  # 2. 데이터베이스 서비스 (예: PostgreSQL)
  db:
    image: postgres:15-alpine # (사용하는 DB 이미지로 변경 가능)
    container_name: ecomong_db
    restart: always # 항상 다시 시작
    environment:
      # DB 컨테이너를 위한 환경 변수 (위 DATABASE_URL과 일치시켜야 함)
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=ecomongdb
    ports:
      - "5432:5432" # PC에서 DB 툴로 접속할 때 사용
    volumes:
      - db_data:/var/lib/postgresql/data # DB 데이터를 PC에 영속적으로 저장

# DB 데이터를 저장할 볼륨 정의
volumes:
  db_data:
