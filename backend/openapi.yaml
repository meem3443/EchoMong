# backend/openapi.yaml
openapi: 3.0.3
info:
  title: EchoMong API
  description: EchoMong 백엔드 서버 API 명세서
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
  description: 로컬 개발 서버

paths:
  # --- Echomong API ---

  /echomongs:
    get:
      summary: 모든 에코몽 목록 조회
      operationId: GetEchomongs
      tags:
      - Echomong
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Echomong"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: 새 에코몽 생성
      operationId: CreateEchomong
      tags:
      - Echomong
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewEchomong"
      responses:
        "201":
          description: 생성된 에코몽
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Echomong"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /echomongs/{echomongId}:
    get:
      summary: ID로 특정 에코몽 조회
      operationId: GetEchomongById
      tags:
      - Echomong
      parameters:
      - name: echomongId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Echomong"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Marker API (Echomong에 종속적) ---

  /echomongs/{echomongId}/markers:
    get:
      summary: 특정 에코몽의 모든 마커 조회
      operationId: GetMarkersForEchomong
      tags:
      - Marker
      parameters:
      - name: echomongId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: 마커 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Marker"
        "404":
          description: 해당 echomongId를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: 특정 에코몽에 새 마커 추가
      operationId: AddMarkerToEchomong
      tags:
      - Marker
      parameters:
      - name: echomongId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMarker"
      responses:
        "201":
          description: 생성된 마커
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Marker"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: 해당 echomongId를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /markers:
    get:
      summary: (지도용) 모든 마커 목록 조회
      operationId: GetAllMarkers
      tags:
      - Marker
      responses:
        "200":
          description: 모든 마커 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Marker"
        "500":
          $ref: "#/components/responses/InternalError"

# --- 재사용 가능한 컴포넌트 정의 ---
components:
  schemas:
    # Echomong (DB에서 읽어올 때)
    Echomong:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true # DB가 생성하므로 읽기 전용
        title:
          type: string
          example: "에코몽 노래"
        lyrics:
          type: string
          example: "반짝 반짝 작은 별"
        img_url:
          type: string
          format: uri
          example: "https://example.com/image.png"
      required:
      - title
      - lyrics
      - img_url

    # NewEchomong (새로 생성할 때)
    NewEchomong:
      type: object
      properties:
        title:
          type: string
          example: "새로운 에코몽"
        lyrics:
          type: string
          example: "아름다운 이 세상"
        img_url:
          type: string
          format: uri
          example: "https://example.com/new.png"
      required:
      - title
      - lyrics
      - img_url

    # Marker (DB에서 읽어올 때)
    Marker:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        echomong_id:
          type: integer
          format: int64
        latitude:
          type: number
          format: float
          example: 36.3504119
        longitude:
          type: number
          format: float
          example: 127.3845475
      required:
      - echomong_id
      - latitude
      - longitude

    # NewMarker (새로 생성할 때 - echomong_id는 URL로 받음)
    NewMarker:
      type: object
      properties:
        latitude:
          type: number
          format: float
          example: 36.3504119
        longitude:
          type: number
          format: float
          example: 127.3845475
      required:
      - latitude
      - longitude

    # 표준 에러 응답
    Error:
      type: object
      properties:
        message:
          type: string
          example: "에러가 발생했습니다."
      required:
      - message

  responses:
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: 잘못된 요청 (입력값 오류)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
